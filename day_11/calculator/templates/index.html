<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Calc | Premium Flask Web App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --font-family-sans: 'Outfit', sans-serif;
            --font-family-mono: 'Space Grotesk', monospace;
            
            --glass-bg: rgba(15, 23, 42, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            
            --glow-indigo: rgba(99, 102, 241, 0.15);
            --glow-cyan: rgba(6, 182, 212, 0.15);
            
            --color-text-main: #f8fafc;
            --color-text-muted: #94a3b8;
            
            --grad-primary: linear-gradient(135deg, #6366f1, #8b5cf6);
            --grad-secondary: linear-gradient(135deg, #06b6d4, #10b981);
            --grad-accent: linear-gradient(135deg, #f59e0b, #ef4444);
            --grad-button: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            --grad-button-hover: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--color-text-main);
            font-family: var(--font-family-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1rem;
        }

        /* Ambient Glowing Background Blobs */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 0;
            pointer-events: none;
            animation: float 20s ease-in-out infinite alternate;
        }

        .glow-1 {
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            background: radial-gradient(circle, rgba(6, 182, 212, 0.35) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            right: -100px;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.1); }
        }

        /* Main Wrapper - Flex Responsive Layout */
        .app-container {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            z-index: 10;
            max-width: 950px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        @media (max-width: 850px) {
            .app-container {
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
            }
        }

        /* Glassmorphism Card Base */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            padding: 1.75rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.05);
        }

        /* Calculator Container */
        .calculator-card {
            width: 380px;
            flex-shrink: 0;
        }

        @media (max-width: 420px) {
            .calculator-card {
                width: 100%;
            }
        }

        /* App Branding header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo {
            width: 24px;
            height: 24px;
            background: var(--grad-primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-family-mono);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .brand-name {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Mode Switcher Toggle */
        .mode-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
        }

        .mode-btn {
            padding: 6px 12px;
            border-radius: 9px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.25s ease;
            z-index: 2;
            color: var(--color-text-muted);
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .mode-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .mode-btn.active.api-active {
            background: var(--grad-primary);
        }

        /* Connectivity Badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--color-text-muted);
            margin-bottom: 1.25rem;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.03);
            width: fit-content;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .status-dot.local {
            background: #06b6d4;
            box-shadow: 0 0 8px #06b6d4;
        }

        /* Calculator Display Screen */
        .display-container {
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            min-height: 110px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .display-formula {
            font-family: var(--font-family-mono);
            font-size: 0.95rem;
            color: var(--color-text-muted);
            min-height: 1.2rem;
            word-wrap: break-word;
            word-break: break-all;
            text-align: right;
            width: 100%;
            opacity: 0.85;
            transition: all 0.2s ease;
        }

        .display-output {
            font-size: 2.1rem;
            font-weight: 500;
            width: 100%;
            text-align: right;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; /* Firefox */
            letter-spacing: -0.5px;
            padding-top: 0.25rem;
        }

        .display-output::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Button Grid Layout */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.7rem;
        }

        /* Individual Button Styling */
        .btn {
            aspect-ratio: 1.15;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            background: var(--grad-button);
            color: var(--color-text-main);
            font-family: var(--font-family-sans);
            font-size: 1.3rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .btn:hover {
            background: var(--grad-button-hover);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        /* Special button highlights */
        .btn-operator {
            background: var(--grad-primary);
            color: #ffffff;
            font-weight: 600;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-operator:hover {
            background: linear-gradient(135deg, #7477f7, #9a6efa);
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
        }

        .btn-clear {
            background: var(--grad-accent);
            color: #ffffff;
            font-weight: 600;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-clear:hover {
            background: linear-gradient(135deg, #f7ab25, #f55a5a);
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35);
        }

        .btn-equals {
            grid-column: span 2;
            aspect-ratio: auto;
            height: 100%;
            background: var(--grad-secondary);
            color: #ffffff;
            font-weight: 600;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-equals:hover {
            background: linear-gradient(135deg, #0ec6e6, #14ca8d);
            box-shadow: 0 6px 18px rgba(6, 182, 212, 0.35);
        }

        /* Keypad labels styles */
        .btn-del {
            font-size: 0.95rem;
            font-family: var(--font-family-mono);
            font-weight: 600;
            color: #ef4444;
        }
        
        .btn-sci {
            font-family: var(--font-family-mono);
            font-size: 1.1rem;
            color: #a855f7;
            font-weight: 600;
        }

        /* Sidebar - Live Network Log / MLOps Console */
        .side-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 400px;
        }

        @media (max-width: 850px) {
            .side-container {
                width: 380px;
            }
        }

        @media (max-width: 420px) {
            .side-container {
                width: 100%;
            }
        }

        .console-panel {
            flex-grow: 1;
            min-height: 220px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-pulse {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0.9); opacity: 1; }
        }

        .console-output {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 0.9rem;
            flex-grow: 1;
            font-family: var(--font-family-mono);
            font-size: 0.72rem;
            line-height: 1.4;
            color: #10b981;
            overflow-y: auto;
            max-height: 220px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* History panel */
        .history-panel {
            min-height: 170px;
            display: flex;
            flex-direction: column;
        }

        .history-list {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 0.75rem;
            flex-grow: 1;
            max-height: 170px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.6rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            font-family: var(--font-family-mono);
            font-size: 0.75rem;
            border-left: 3px solid #6366f1;
            animation: slide-in 0.2s ease-out;
        }

        .history-item.local-calc {
            border-left-color: #06b6d4;
        }

        .history-expr {
            color: var(--color-text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 0.5rem;
        }

        .history-val {
            color: #ffffff;
            font-weight: 600;
        }

        .no-history {
            color: var(--color-text-muted);
            font-size: 0.75rem;
            text-align: center;
            margin: auto;
            font-style: italic;
        }

        .btn-clear-history {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .btn-clear-history:hover {
            opacity: 1;
        }

        @keyframes slide-in {
            from { transform: translateX(10px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Quick-Info/Docker details footer */
        .docker-footer {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            z-index: 10;
        }

        .docker-icon {
            width: 16px;
            height: 16px;
            fill: #0db7ed;
        }
    </style>
</head>
<body>

    <!-- Ambient glowing shapes -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        
        <div class="app-container">
            
            <!-- Left Panel: Calculator Card -->
            <div class="glass-panel calculator-card">
                
                <!-- Branding & Mode Switcher -->
                <div class="header">
                    <div class="brand">
                        <div class="brand-logo">Q</div>
                        <span class="brand-name">Quantum Calc</span>
                    </div>
                    
                    <div class="mode-toggle" id="modeToggle">
                        <button class="mode-btn active api-active" id="btnServerMode">Flask API</button>
                        <button class="mode-btn" id="btnLocalMode">Local JS</button>
                    </div>
                </div>

                <!-- Live Connection Badge -->
                <div class="status-badge" id="statusBadge">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">🟢 Flask Server API Active</span>
                </div>

                <!-- Display Screen -->
                <div class="display-container">
                    <div class="display-formula" id="displayFormula"></div>
                    <div class="display-output" id="displayOutput">0</div>
                </div>

                <!-- Button Layout Grid -->
                <div class="btn-grid">
                    <!-- Row 1: Controls & Operators -->
                    <button class="btn btn-clear" data-action="clear">C</button>
                    <button class="btn btn-sci" data-val="^">^</button>
                    <button class="btn btn-sci" data-val="%">%</button>
                    <button class="btn btn-operator" data-val="/">&divide;</button>

                    <!-- Row 2: Digits & Multiply -->
                    <button class="btn" data-val="7">7</button>
                    <button class="btn" data-val="8">8</button>
                    <button class="btn" data-val="9">9</button>
                    <button class="btn btn-operator" data-val="*">&times;</button>

                    <!-- Row 3: Digits & Subtract -->
                    <button class="btn" data-val="4">4</button>
                    <button class="btn" data-val="5">5</button>
                    <button class="btn" data-val="6">6</button>
                    <button class="btn btn-operator" data-val="-">-</button>

                    <!-- Row 4: Digits & Add -->
                    <button class="btn" data-val="1">1</button>
                    <button class="btn" data-val="2">2</button>
                    <button class="btn" data-val="3">3</button>
                    <button class="btn btn-operator" data-val="+">+</button>

                    <!-- Row 5: Decimals, Delete & Equals -->
                    <button class="btn" data-val="0">0</button>
                    <button class="btn" data-val=".">.</button>
                    <button class="btn btn-del" data-action="delete">DEL</button>
                    <button class="btn btn-equals" data-action="calculate">=</button>
                </div>
            </div>

            <!-- Right Panel: Dev logs / History drawer -->
            <div class="side-container">
                
                <!-- Live Console Logger for MLOps -->
                <div class="glass-panel console-panel">
                    <div class="panel-title">
                        <span>📡 API Network Console</span>
                        <div class="panel-pulse" id="consolePulse"></div>
                    </div>
                    <div class="console-output" id="consoleOutput">> Client initialized. Waiting for calculation...</div>
                </div>

                <!-- History Tape -->
                <div class="glass-panel history-panel">
                    <div class="panel-title">
                        <span>🕰️ History Tape</span>
                        <button class="btn-clear-history" id="btnClearHistory">Clear</button>
                    </div>
                    <div class="history-list" id="historyList">
                        <div class="no-history" id="noHistory">No calculations recorded yet.</div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Docker Branding Footer -->
        <div class="docker-footer">
            <svg class="docker-icon" viewBox="0 0 24 24">
                <path d="M13.962 10.603h-2.336v2.193h2.336v-2.193zm2.544-2.223h-2.336v2.193h2.336V8.38zm-5.088 2.223H9.082v2.193h2.336v-2.193zm-2.544 0H6.538v2.193h2.336v-2.193zM9.082 8.38H6.538v2.193h2.336V8.38zm5.088-2.224h-2.336v2.193h2.336V6.156zm-2.544 0H9.082v2.193h2.336V6.156zm5.088 0h-2.336v2.193h2.336V6.156zm4.512 4.447c-.06-.015-.226-.046-.498-.046a3.863 3.863 0 0 0-1.343.242c-.046-.467-.272-1.373-.83-2.008-.558-.62-1.313-.86-1.993-.86-.105 0-.21.008-.316.015a5.88 5.88 0 0 0-3.926-1.524H12v2.193h2.336V8.38h.438c.453 0 .966.12 1.253.498.241.317.377.92.377 1.487a3.784 3.784 0 0 0-1.524 3.033c0 2.235 1.765 3.32 3.653 3.32a6.945 6.945 0 0 0 3.29-.86c.65-.393.996-1.072 1.072-1.442.06-.317.075-2.912-1.57-3.66zm-5.088 4.416h-2.336v2.193h2.336v-2.193zm-2.544 0H9.082v2.193h2.336v-2.193zm-2.544 0H6.538v2.193h2.336v-2.193zm-2.544 0H4.01v2.193h2.336v-2.193z"/>
            </svg>
            <span>Ready for Docker containerization</span>
        </div>

    </div>

    <script>
        // DOM elements
        const displayFormula = document.getElementById('displayFormula');
        const displayOutput = document.getElementById('displayOutput');
        const modeToggle = document.getElementById('modeToggle');
        const btnServerMode = document.getElementById('btnServerMode');
        const btnLocalMode = document.getElementById('btnLocalMode');
        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const consoleOutput = document.getElementById('consoleOutput');
        const consolePulse = document.getElementById('consolePulse');
        const historyList = document.getElementById('historyList');
        const noHistory = document.getElementById('noHistory');
        const btnClearHistory = document.getElementById('btnClearHistory');
        const buttons = document.querySelectorAll('.btn');

        // Calculator State
        let currentOperand = '';
        let previousOperand = '';
        let activeOperator = null;
        let isCalculated = false;
        let isServerMode = true; // Default to Flask server calculations

        // Switch modes event
        btnServerMode.addEventListener('click', () => setMode(true));
        btnLocalMode.addEventListener('click', () => setMode(false));

        function setMode(serverMode) {
            isServerMode = serverMode;
            if (isServerMode) {
                btnServerMode.classList.add('active', 'api-active');
                btnLocalMode.classList.remove('active');
                statusDot.classList.remove('local');
                statusText.innerText = '🟢 Flask Server API Active';
                consolePulse.style.background = '#10b981';
                logConsole('Mode switched to [Flask Server API]. Calculations will hit /calculate endpoint.');
            } else {
                btnLocalMode.classList.add('active');
                btnServerMode.classList.remove('active', 'api-active');
                statusDot.classList.add('local');
                statusText.innerText = '⚡ Local Javascript Active';
                consolePulse.style.background = '#06b6d4';
                logConsole('Mode switched to [Local JS]. Calculations will be executed offline in browser.');
            }
        }

        // Live logger
        function logConsole(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            let newLog = `\n[${time}] ${isError ? '❌ ERROR: ' : '> '}${message}`;
            consoleOutput.innerText += newLog;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        // Audio haptic feedback simulator (subtle clicks)
        function triggerHaptic() {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        }

        // Button Clicks dispatcher
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                triggerHaptic();
                
                const val = button.getAttribute('data-val');
                const action = button.getAttribute('data-action');

                if (val !== null) {
                    handleInput(val);
                } else if (action !== null) {
                    handleAction(action);
                }
            });
        });

        // Keypad input logic
        function handleInput(val) {
            // If just finished a calculation, override or append properly
            if (isCalculated) {
                if (['+', '-', '*', '/', '^', '%'].includes(val)) {
                    isCalculated = false;
                } else {
                    currentOperand = '';
                    isCalculated = false;
                }
            }

            // Decimal points check
            if (val === '.' && currentOperand.includes('.')) return;

            // Handle multi operators logic
            if (['+', '-', '*', '/', '^', '%'].includes(val)) {
                if (currentOperand === '' && previousOperand === '') {
                    if (val === '-') {
                        currentOperand = '-';
                        updateDisplay();
                    }
                    return;
                }
                
                if (currentOperand === '') {
                    activeOperator = val;
                    updateDisplay();
                    return;
                }

                if (previousOperand !== '') {
                    // Evaluate current expression first
                    calculateExpression();
                }

                activeOperator = val;
                previousOperand = currentOperand;
                currentOperand = '';
                updateDisplay();
                return;
            }

            // Standard digit append
            currentOperand = currentOperand === '0' ? val : currentOperand + val;
            updateDisplay();
        }

        function handleAction(action) {
            switch(action) {
                case 'clear':
                    currentOperand = '';
                    previousOperand = '';
                    activeOperator = null;
                    isCalculated = false;
                    updateDisplay();
                    logConsole('Calculator cleared.');
                    break;
                case 'delete':
                    if (isCalculated) {
                        currentOperand = '';
                        isCalculated = false;
                    } else {
                        currentOperand = currentOperand.toString().slice(0, -1);
                    }
                    updateDisplay();
                    break;
                case 'calculate':
                    if (currentOperand === '' || previousOperand === '' || !activeOperator) return;
                    calculateExpression();
                    break;
            }
        }

        function updateDisplay() {
            // Format operator symbol for screen
            const displaySymbols = {
                '+': '+',
                '-': '-',
                '*': '×',
                '/': '÷',
                '^': '^',
                '%': '%'
            };

            if (activeOperator && previousOperand !== '') {
                displayFormula.innerText = `${previousOperand} ${displaySymbols[activeOperator] || activeOperator}`;
            } else {
                displayFormula.innerText = '';
            }

            displayOutput.innerText = currentOperand || '0';
        }

        // Calculation Core Router
        function calculateExpression() {
            const num1 = previousOperand;
            const num2 = currentOperand;
            const op = activeOperator;
            
            // Clean up UI states immediately
            previousOperand = '';
            activeOperator = null;
            isCalculated = true;

            const opNames = {
                '+': 'add',
                '-': 'subtract',
                '*': 'multiply',
                '/': 'divide',
                '^': 'power',
                '%': 'mod'
            };

            if (isServerMode) {
                executeServerCalculation(num1, num2, opNames[op]);
            } else {
                executeLocalCalculation(num1, num2, op);
            }
        }

        // 1. Flask API Calculations
        async function executeServerCalculation(num1, num2, operation) {
            const payload = {
                num1: parseFloat(num1),
                num2: parseFloat(num2),
                operation: operation
            };

            logConsole(`POST to backend API /calculate: ${JSON.stringify(payload)}`);
            const startTime = performance.now();

            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();
                const latency = Math.round(performance.now() - startTime);

                if (data.success) {
                    currentOperand = data.result.toString();
                    updateDisplay();
                    logConsole(`Success: ${data.expression} = ${data.result} (Network Latency: ${latency}ms)`);
                    
                    // Add to history tape
                    addHistoryItem(data.expression, data.result, true);
                } else {
                    currentOperand = 'Error';
                    updateDisplay();
                    logConsole(data.error || 'Unknown error occurred.', true);
                }
            } catch (err) {
                currentOperand = 'Error';
                updateDisplay();
                logConsole(`Network request failed! Ensure Flask Server is running. Error: ${err.message}`, true);
            }
        }

        // 2. Client Side JavaScript Calculations
        function executeLocalCalculation(num1Str, num2Str, op) {
            const num1 = parseFloat(num1Str);
            const num2 = parseFloat(num2Str);
            let result = 0;

            logConsole(`Browser engine processing locally: ${num1Str} ${op} ${num2Str}`);
            
            if (isNaN(num1) || isNaN(num2)) {
                currentOperand = 'Error';
                updateDisplay();
                logConsole('Invalid inputs in local engine.', true);
                return;
            }

            switch(op) {
                case '+': result = num1 + num2; break;
                case '-': result = num1 - num2; break;
                case '*': result = num1 * num2; break;
                case '/':
                    if (num2 === 0) {
                        currentOperand = 'Error';
                        updateDisplay();
                        logConsole('Cannot divide by zero in local engine.', true);
                        return;
                    }
                    result = num1 / num2;
                    break;
                case '^': result = Math.pow(num1, num2); break;
                case '%': 
                    if (num2 === 0) {
                        currentOperand = 'Error';
                        updateDisplay();
                        logConsole('Cannot divide by zero in local engine.', true);
                        return;
                    }
                    result = num1 % num2; 
                    break;
                default:
                    currentOperand = 'Error';
                    updateDisplay();
                    logConsole(`Unsupported operator ${op}`, true);
                    return;
            }

            // Handle floats anomalies
            if (Number.isInteger(result)) {
                result = parseInt(result);
            } else {
                result = Math.round(result * 1e10) / 1e10;
            }

            const displaySymbols = { '+': '+', '-': '-', '*': '×', '/': '÷', '^': '^', '%': '%' };
            const expr = `${num1Str} ${displaySymbols[op] || op} ${num2Str}`;

            currentOperand = result.toString();
            updateDisplay();
            logConsole(`Success (Offline): ${expr} = ${result}`);

            addHistoryItem(expr, result, false);
        }

        // Add history tape items
        function addHistoryItem(expr, result, isServer) {
            noHistory.style.display = 'none';

            const item = document.createElement('div');
            item.className = `history-item ${!isServer ? 'local-calc' : ''}`;
            
            const badgeText = isServer ? 'flask' : 'local';
            
            item.innerHTML = `
                <span class="history-expr" title="${expr} [${badgeText}]">${expr}</span>
                <span class="history-val">${result}</span>
            `;

            historyList.insertBefore(item, historyList.firstChild);

            // Cap at 10 items
            if (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        // Clear history tape
        btnClearHistory.addEventListener('click', () => {
            historyList.innerHTML = '';
            historyList.appendChild(noHistory);
            noHistory.style.display = 'block';
            logConsole('History tape cleared.');
        });
    </script>
</body>
</html>
